# SPDX-License-Identifier: AGPL-3.0-or-later
# Deploys a release to Cloudflare: tests, D1 migrations (additive, so they go
# first), the Worker, then a smoke test of /api/health for the deployed SHA.
# Called by release-please.yml when a release is created; can also be run by
# hand for a tag or commit (e.g. to redeploy). Forks without Cloudflare
# secrets skip with a notice instead of failing.
name: Deploy

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to deploy
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or commit to deploy (e.g. v0.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      WORKER_NAME: ${{ vars.WORKER_NAME }}
      CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
      SOURCE_URL: ${{ vars.SOURCE_URL }}
    steps:
      - name: Check Cloudflare configuration
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice title=Deploy skipped::CLOUDFLARE_API_TOKEN is not set. See README → Deploy your own."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=""
          for v in CLOUDFLARE_ACCOUNT_ID PUBLIC_ORIGIN D1_DATABASE_ID; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Deploy misconfigured::Missing GitHub Secrets/Variables:$missing"
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.check.outputs.enabled == 'true'
        with:
          ref: ${{ inputs.ref }}
      - name: Resolve commit
        if: steps.check.outputs.enabled == 'true'
        run: echo "GIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        if: steps.check.outputs.enabled == 'true'
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        if: steps.check.outputs.enabled == 'true'
        with:
          node-version: 24
      - if: steps.check.outputs.enabled == 'true'
        run: bun install --frozen-lockfile
      # The release commit itself must pass, on both platforms, before it ships.
      - name: Tests
        if: steps.check.outputs.enabled == 'true'
        run: bun run test && bun run test:bun
      - name: Build
        if: steps.check.outputs.enabled == 'true'
        run: bun run build
      - name: Apply D1 migrations
        if: steps.check.outputs.enabled == 'true'
        run: bunx wrangler d1 migrations apply DB --remote
      - name: Deploy Worker
        if: steps.check.outputs.enabled == 'true'
        run: bunx wrangler deploy --env ''
      - name: Smoke test
        if: steps.check.outputs.enabled == 'true'
        run: bun scripts/smoke-test.ts

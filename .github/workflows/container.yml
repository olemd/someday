# SPDX-License-Identifier: AGPL-3.0-or-later
# Builds the self-hosted image (Containerfile) and smoke-tests it, so
# self-hosting cannot silently rot (§10). Build only: images are published
# per release by release-please.yml.
name: Container

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        env:
          BUILDAH_FORMAT: docker
        run: |
          podman build \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg GIT_REVISION="${GITHUB_SHA}" \
            --build-arg APP_VERSION="$(jq -r .version package.json)" \
            -t localhost/someday:ci .
      - name: Smoke test
        run: scripts/container-smoke.sh localhost/someday:ci

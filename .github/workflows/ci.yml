# Checks on every PR and push to main (§10): typecheck, lint, unit and
# integration tests against both platform adapters (Workers pool and
# Bun/SQLite), build. container.yml builds the Podman image. Production is
# only deployed for releases (release-please.yml → deploy.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      GIT_SHA: ${{ github.sha }}
      SOURCE_URL: ${{ vars.SOURCE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Third-party tools (wrangler, vite, vitest) run on Node.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run i18n:check
      - name: Tests (Cloudflare Workers pool, D1)
        run: bun run test
      - name: Tests (Bun, SQLite)
        run: bun run test:bun
      - run: bun run build
      - name: Licence check (AGPL-compatible dependencies only)
        run: bun run licenses
